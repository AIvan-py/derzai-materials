<title>__TITLE__</title>
<style>
body{margin:0;background:#1D2740;color:#F4F6FA;font:17px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
.box{max-width:420px;margin:0 auto;padding:14vh 24px 40px}
h1{font-size:30px;margin:0 0 6px;letter-spacing:.02em}
h1 span{color:#D4F53C}
p{margin:0 0 18px;color:#A3ACC0}
label{display:block;font-size:14px;color:#A3ACC0;margin:0 0 6px}
input[type=password],input[type=text]{width:100%;box-sizing:border-box;font-size:20px;padding:12px 14px;border:1px solid #3D4A69;border-radius:8px;background:#141B2E;color:#F4F6FA;-webkit-appearance:none}
.row{margin:14px 0 18px;font-size:15px;color:#A3ACC0}
.row input{width:20px;height:20px;vertical-align:-4px;margin-right:8px}
button{width:100%;font-size:18px;font-weight:600;padding:13px;border:0;border-radius:8px;background:#D4F53C;color:#1D2740;cursor:pointer}
button[disabled]{opacity:.6}
#msg{min-height:24px;margin-top:14px;font-size:15px;color:#F5C02E}
.hint{margin-top:34px;font-size:13px;color:#5B6478}
.hint b{color:#A3ACC0;font-weight:500}
</style>
</head>
<body>
<div class="box">
  <h1>Дерз<span>ай</span></h1>
  <p>__SUBTITLE__</p>
  <form id="f" autocomplete="off">
    <label for="pw">Пароль</label>
    <input type="password" id="pw" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row"><label style="display:inline;font-size:15px"><input type="checkbox" id="keep" checked> Запомнить на этом устройстве</label></div>
    <button type="submit" id="go">Открыть</button>
    <div id="msg" role="status"></div>
  </form>
  <p class="hint"><b>Ярлык на экран «Домой»:</b> в Safari нажмите «Поделиться» → «На экран “Домой”». С отметкой «запомнить» страница будет открываться сразу.</p>
</div>
<script>__AESJS__</script>
<script>__CRYPTO__</script>
<script>
(function () {
  var SALT = DerzaiCrypto.fromB64('__SALT__'), IV = DerzaiCrypto.fromB64('__IV__'), ITER = __ITER__, MARK = 'DERZAI1\n';
  var CT = null, KEYNAME = 'derzai.key:' + '__SALT__'.slice(0, 12); // своя запись на каждую страницу
  var pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go'), keep = document.getElementById('keep');
  function say(t) { msg.textContent = t; }
  // шифротекст лежит в конце страницы: на медленной сети он ещё грузится, когда пользователь уже нажал «Открыть»
  function ready(fn) { if (document.readyState === 'complete') fn(); else window.addEventListener('load', fn); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function ct() { if (!CT) CT = DerzaiCrypto.fromB64(document.getElementById('ct').textContent.replace(/\s+/g, '')); return CT; }
  function decrypt(key) {
    var aes = new aesjs.ModeOfOperation.cbc(key, IV);
    var pt = aes.decrypt(ct());
    var pad = pt[pt.length - 1];
    if (!(pad >= 1 && pad <= 16)) return null;
    pt = pt.subarray(0, pt.length - pad);
    var head = aesjs.utils.utf8.fromBytes(pt.subarray(0, MARK.length));
    if (head !== MARK) return null;
    return aesjs.utils.utf8.fromBytes(pt.subarray(MARK.length));
  }
  function open(html) {
    document.open('text/html', 'replace');
    document.write(html);
    document.close();
  }
  function derive(password, cb) {
    var pwb = DerzaiCrypto.utf8(password);
    var subtle = window.crypto && window.crypto.subtle;
    if (subtle && window.TextEncoder && subtle.importKey) {
      try {
        subtle.importKey('raw', pwb, { name: 'PBKDF2' }, false, ['deriveBits']).then(function (k) {
          return subtle.deriveBits({ name: 'PBKDF2', salt: SALT, iterations: ITER, hash: 'SHA-256' }, k, 256);
        }).then(function (bits) { cb(new Uint8Array(bits)); }, function () { cb(DerzaiCrypto.pbkdf2(pwb, SALT, ITER, 32)); });
        return;
      } catch (e) {}
    }
    cb(DerzaiCrypto.pbkdf2(pwb, SALT, ITER, 32));
  }
  function attempt(key, fromMemory) {
    var html = null;
    try { html = decrypt(key); } catch (e) { html = null; }
    if (html) { if (keep.checked && !fromMemory) store(KEYNAME, DerzaiCrypto.hex(key)); open(html); return true; }
    if (fromMemory) store(KEYNAME, null);
    return false;
  }
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var p = pw.value;
    if (!p) { say('Введите пароль'); return; }
    go.disabled = true; say(document.readyState === 'complete' ? 'Проверяю пароль…' : 'Страница ещё загружается, секунду…');
    ready(function () {
      say('Проверяю пароль…');
      setTimeout(function () {
        derive(p, function (key) {
          if (!attempt(key, false)) { go.disabled = false; say('Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.'); pw.select(); }
        });
      }, 40);
    });
  };
  var saved = load(KEYNAME);
  if (saved && saved.length === 64) { say('Открываю…'); ready(function () { setTimeout(function () { if (!attempt(DerzaiCrypto.unhex(saved), true)) say(''); }, 40); }); }
  else pw.focus();
})();
</script>
<script type="text/plain" id="ct">__CT__</script>
</body>
</html>
